<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>車椅子ルート・バリアマップ＆環境ビューワー</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: 'Helvetica Neue', Arial, sans-serif; }
    #container { display: flex; flex-direction: column; height: 100vh; }
    #control-panel { padding: 10px 20px; background-color: #2c3e50; color: #ecf0f1; display: flex; flex-direction: column; gap: 10px; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    .control-row { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
    .control-group { display: flex; align-items: center; gap: 8px; background-color: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 6px; }
    select { padding: 6px 12px; border-radius: 4px; border: none; font-size: 14px; cursor: pointer; }
    input[type=range] { vertical-align: middle; cursor: pointer; width: 100px; }
    .slider-val { font-weight: bold; min-width: 45px; display: inline-block; text-align: right; }
    .checkbox-label { font-size: 14px; cursor: pointer; user-select: none; display: flex; align-items: center; gap: 5px; }
    #map { flex: 1; width: 100%; }
    .legend { background: white; padding: 10px; border-radius: 5px; font-size: 12px; line-height: 18px; color: #333; box-shadow: 0 0 15px rgba(0,0,0,0.2); }
    .legend i { width: 12px; height: 12px; float: left; margin-right: 8px; border-radius: 50%; }
  </style>
</head>
<body>

<div id="container">
  <div id="control-panel">
    <!-- 上段：ルート・種別 -->
    <div class="control-row">
      <div class="control-group">
        <label><strong>対象ルート:</strong></label>
        <select id="mode-select"><option value="">コース一覧を取得中...</option></select>
      </div>
      <div class="control-group">
        <label><strong>データ種別:</strong></label>
        <select id="datatype-select">
          <option value="cleansed">クレンジングデータ (OSRM補正済み)</option>
          <option value="raw">生軌跡ライン (Raw Geometry)</option>
        </select>
      </div>
      <span id="status-msg" style="color: #f1c40f; font-size: 13px; font-weight: bold;"></span>
    </div>

    <!-- 下段：バリアフィルタ -->
    <div class="control-row">
      <!-- 段差フィルタ (G) -->
      <div class="control-group">
        <label class="checkbox-label" style="color: #ff7675;">
          <input type="checkbox" id="chk-step" checked> <strong>段差(G)表示:</strong>
        </label>
        <input type="range" id="step-slider" min="0" max="10" step="0.5" value="3.5">
        <span class="slider-val"><span id="step-val-text">3.5</span> G</span>
      </div>

      <!-- ウィリーフィルタ (deg/s) -->
      <div class="control-group">
        <label class="checkbox-label" style="color: #fdcb6e;">
          <input type="checkbox" id="chk-wheelie" checked> <strong>ウィリー表示:</strong>
        </label>
        <input type="range" id="wheelie-slider" min="0" max="300" step="10" value="100">
        <span class="slider-val"><span id="wheelie-val-text">100</span> deg/s</span>
      </div>

      <!-- 急傾斜フィルタ (度) -->
      <div class="control-group">
        <label class="checkbox-label" style="color: #a29bfe;">
          <input type="checkbox" id="chk-steep" checked> <strong>急傾斜表示:</strong>
        </label>
        <input type="range" id="steep-slider" min="0" max="30" step="1" value="5">
        <span class="slider-val"><span id="steep-val-text">5</span> 度</span>
      </div>
    </div>
  </div>

  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // ==========================================
  // 接続設定（GitHub Actions やデプロイ時に置換）
  // ==========================================
  const SUPABASE_URL = '__SUPABASE_URL__';
  const SUPABASE_ANON_KEY = '__SUPABASE_ANON_KEY__';

  const supabaseClient = (SUPABASE_URL.startsWith('__')) 
    ? null 
    : window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const map = L.map('map').setView([33.883, 130.875], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap contributors' }).addTo(map);

  const dataLayerGroup = L.layerGroup().addTo(map);
  const barrierLayerGroup = L.layerGroup().addTo(map);
  let currentBarriers = [];
  
  // UI要素
  const modeSelect = document.getElementById('mode-select');
  const dataTypeSelect = document.getElementById('datatype-select');
  const statusMsg = document.getElementById('status-msg');

  // バリアフィルタUI要素
  const chkStep = document.getElementById('chk-step');
  const stepSlider = document.getElementById('step-slider');
  const stepValText = document.getElementById('step-val-text');

  const chkWheelie = document.getElementById('chk-wheelie');
  const wheelieSlider = document.getElementById('wheelie-slider');
  const wheelieValText = document.getElementById('wheelie-val-text');

  const chkSteep = document.getElementById('chk-steep');
  const steepSlider = document.getElementById('steep-slider');
  const steepValText = document.getElementById('steep-val-text');

  // イベントリスナー
  modeSelect.addEventListener('change', loadData);
  dataTypeSelect.addEventListener('change', loadData);

  // チェックボックスON/OFFで即時更新
  [chkStep, chkWheelie, chkSteep].forEach(chk => {
    chk.addEventListener('change', updateBarrierDisplay);
  });

  // スライダー操作でテキスト更新＆即時描画
  stepSlider.addEventListener('input', function() {
    stepValText.innerText = parseFloat(this.value).toFixed(1);
    updateBarrierDisplay();
  });
  wheelieSlider.addEventListener('input', function() {
    wheelieValText.innerText = parseInt(this.value, 10);
    updateBarrierDisplay();
  });
  steepSlider.addEventListener('input', function() {
    steepValText.innerText = parseInt(this.value, 10);
    updateBarrierDisplay();
  });

  function parsePointGeom(geom) {
    if (!geom) return null;
    if (geom.type === 'Point' && Array.isArray(geom.coordinates)) return [geom.coordinates[1], geom.coordinates[0]];
    if (typeof geom === 'string') {
      const match = geom.match(/POINT\s*\(\s*([-\d.]+)\s+([-\d.]+)\s*\)/i);
      if (match) return [parseFloat(match[2]), parseFloat(match[1])];
    }
    return null;
  }

  async function fetchTripList() {
    if (!supabaseClient) return;
    try {
      const { data: trips } = await supabaseClient.from('trips').select('trip_id, title, measured_date').order('created_at', { ascending: false });
      modeSelect.innerHTML = '';
      if (trips && trips.length > 0) {
        trips.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t.trip_id;
          opt.textContent = `ID:${t.trip_id} | ${t.measured_date} | ${t.title}`;
          modeSelect.appendChild(opt);
        });
        loadData();
      }
    } catch (err) { console.error(err); }
  }

  async function loadData() {
    const tripId = modeSelect.value;
    if (!tripId || !supabaseClient) return;

    dataLayerGroup.clearLayers();
    barrierLayerGroup.clearLayers();
    statusMsg.innerText = '更新中...';
    
    try {
      const targetCol = (dataTypeSelect.value === 'raw') ? 'raw_geom' : 'cleansed_geom';
      // barriersは最大10000件程度まで取得範囲を拡張
      const [barriersRes, tripRes] = await Promise.all([
        supabaseClient.from('barriers').select('barrier_type, intensity, geom').eq('trip_id', tripId).limit(10000),
        supabaseClient.from('trips').select(targetCol).eq('trip_id', tripId).single()
      ]);

      currentBarriers = barriersRes.data || [];
      const tripData = tripRes.data;

      if (!tripData || !tripData[targetCol]) {
        statusMsg.innerText = 'データなし';
        return;
      }

      const rawGeom = tripData[targetCol];
      let coordsArray = [];
      if (rawGeom.type === 'LineString') coordsArray = rawGeom.coordinates;
      else if (typeof rawGeom === 'string') coordsArray = rawGeom.replace(/^.*LINESTRING\s*\(/i, '').replace(/\).*$/, '').split(',').map(p => p.trim().split(/\s+/).map(Number));

      if (coordsArray.length > 0) {
        const latLngs = coordsArray.map(c => [c[1], c[0]]);
        L.polyline(latLngs, { color: (dataTypeSelect.value === 'raw') ? '#8e44ad' : '#16a085', weight: 6, opacity: 0.9 }).addTo(dataLayerGroup);
        map.fitBounds(L.polyline(latLngs).getBounds(), { padding: [30, 30] });
        renderStartEnd(latLngs[0], latLngs[latLngs.length - 1]);
      }
      
      updateBarrierDisplay();
      statusMsg.innerText = '';
    } catch (err) { console.error(err); }
  }

  function updateBarrierDisplay() {
    barrierLayerGroup.clearLayers();

    // フィルタ設定の取得
    const isStepOn = chkStep.checked;
    const stepThresh = parseFloat(stepSlider.value);
    
    const isWheelieOn = chkWheelie.checked;
    const wheelieThresh = parseFloat(wheelieSlider.value);
    
    const isSteepOn = chkSteep.checked;
    const steepThresh = parseFloat(steepSlider.value);

    currentBarriers.forEach(b => {
      let draw = false;
      let color = '';
      let label = '';
      let radius = 6;

      if (b.barrier_type === 'step' && isStepOn && b.intensity >= stepThresh) {
        draw = true;
        color = '#d63031'; // 赤
        label = `段差衝撃: ${Number(b.intensity).toFixed(2)} G`;
        radius = 7;
      } 
      else if (b.barrier_type === 'wheelie' && isWheelieOn && Math.abs(b.intensity) >= wheelieThresh) {
        draw = true;
        color = '#e17055'; // オレンジ
        label = `ウィリー: ${Number(Math.abs(b.intensity)).toFixed(1)} deg/s`;
        radius = 6;
      } 
      else if (b.barrier_type === 'steep_slope' && isSteepOn && b.intensity >= steepThresh) {
        draw = true;
        color = '#6c5ce7'; // 紫
        label = `急傾斜: ${Number(b.intensity).toFixed(1)} 度`;
        radius = 5;
      }

      if (draw) {
        const coords = parsePointGeom(b.geom);
        if (coords) {
          L.circleMarker(coords, { radius: radius, fillColor: color, color: '#ffffff', weight: 1.5, fillOpacity: 0.85 })
           .bindTooltip(label, { direction: 'top' }).addTo(barrierLayerGroup);
        }
      }
    });
  }

  function renderStartEnd(startPt, endPt) {
    const createIcon = (t, c) => L.divIcon({ className: '', html: `<div style="background:${c}; color:white; font-weight:bold; width:24px; height:24px; line-height:24px; text-align:center; border-radius:50%; border:2px solid white; box-shadow:0 2px 5px rgba(0,0,0,0.3);">${t}</div>`, iconSize: [28, 28], iconAnchor: [14, 14] });
    L.marker(startPt, { icon: createIcon('S', '#00b894') }).addTo(dataLayerGroup);
    L.marker(endPt, { icon: createIcon('G', '#d63031') }).addTo(dataLayerGroup);
  }

  const legend = L.control({ position: 'bottomright' });
  legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'legend');
    div.innerHTML += '<b>表示凡例</b><br>';
    div.innerHTML += '<i style="background: #16a085;"></i>ルート (OSRM補正)<br>';
    div.innerHTML += '<i style="background: #d63031;"></i>段差・衝撃 (赤)<br>';
    div.innerHTML += '<i style="background: #e17055;"></i>ウィリー動作 (オレンジ)<br>';
    div.innerHTML += '<i style="background: #6c5ce7;"></i>急傾斜 (紫)<br>';
    return div;
  };
  legend.addTo(map);

  fetchTripList();
</script>
</body>
</html>
