<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>車椅子ルート・バリアマップ＆環境ビューワー</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: 'Helvetica Neue', Arial, sans-serif; }
    #container { display: flex; flex-direction: column; height: 100vh; }
    #control-panel { padding: 10px 20px; background-color: #2c3e50; color: #ecf0f1; display: flex; gap: 15px; align-items: center; z-index: 1000; flex-wrap: wrap; }
    .control-group { display: flex; align-items: center; gap: 8px; }
    select { padding: 6px 12px; border-radius: 4px; border: none; font-size: 14px; cursor: pointer; }
    input[type=range] { vertical-align: middle; cursor: pointer; }
    .slider-val { font-weight: bold; min-width: 45px; display: inline-block; text-align: right; }
    .checkbox-label { font-size: 14px; cursor: pointer; user-select: none; }
    #map { flex: 1; width: 100%; }
    .legend { background: white; padding: 10px; border-radius: 5px; font-size: 12px; line-height: 18px; color: #333; box-shadow: 0 0 15px rgba(0,0,0,0.2); }
    .legend i { width: 12px; height: 12px; float: left; margin-right: 8px; border-radius: 50%; }
  </style>
</head>
<body>

<div id="container">
  <div id="control-panel">
    <div class="control-group">
      <label><strong>対象ルート:</strong></label>
      <select id="mode-select"><option value="">コース一覧を取得中...</option></select>
    </div>
    <div class="control-group">
      <label><strong>データ種別:</strong></label>
      <select id="datatype-select">
        <option value="cleansed">クレンジングデータ (OSRM補正済み)</option>
        <option value="raw">生軌跡ライン (Raw Geometry)</option>
      </select>
    </div>
    <div class="control-group">
      <label><strong>段差(G)表示:</strong></label>
      <input type="range" id="barrier-slider" min="0" max="10" step="0.5" value="0.0">
      <span class="slider-val"><span id="barrier-val-text">0.0</span> G</span>
    </div>
    <div class="control-group">
      <label class="checkbox-label"><input type="checkbox" id="chk-wheelie" checked> ウィリー動作</label>
      <label class="checkbox-label"><input type="checkbox" id="chk-steep" checked> 急傾斜(5度以上)</label>
    </div>
    <span id="status-msg" style="color: #f1c40f; font-size: 13px; font-weight: bold;"></span>
  </div>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = '__SUPABASE_URL__';
  const SUPABASE_ANON_KEY = '__SUPABASE_ANON_KEY__';
  const supabaseClient = (SUPABASE_URL.startsWith('__')) ? null : window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const map = L.map('map').setView([33.883, 130.875], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

  const dataLayerGroup = L.layerGroup().addTo(map);
  const barrierLayerGroup = L.layerGroup().addTo(map);
  let currentBarriers = [];
  
  const modeSelect = document.getElementById('mode-select');
  const dataTypeSelect = document.getElementById('datatype-select');
  const barrierSlider = document.getElementById('barrier-slider');
  const barrierValText = document.getElementById('barrier-val-text');
  const chkWheelie = document.getElementById('chk-wheelie');
  const chkSteep = document.getElementById('chk-steep');
  const statusMsg = document.getElementById('status-msg');

  modeSelect.addEventListener('change', loadData);
  dataTypeSelect.addEventListener('change', loadData);
  chkWheelie.addEventListener('change', updateBarrierDisplay);
  chkSteep.addEventListener('change', updateBarrierDisplay);
  
  barrierSlider.addEventListener('input', function() {
    barrierValText.innerText = parseFloat(this.value).toFixed(1);
    updateBarrierDisplay();
  });

  function parsePointGeom(geom) {
    if (!geom) return null;
    if (geom.type === 'Point' && Array.isArray(geom.coordinates)) return [geom.coordinates[1], geom.coordinates[0]];
    if (typeof geom === 'string') {
      const match = geom.match(/POINT\s*\(\s*([-\d.]+)\s+([-\d.]+)\s*\)/i);
      if (match) return [parseFloat(match[2]), parseFloat(match[1])];
    }
    return null;
  }

  async function fetchTripList() {
    if (!supabaseClient) return;
    try {
      const { data: trips } = await supabaseClient.from('trips').select('trip_id, title, measured_date').order('created_at', { ascending: false });
      modeSelect.innerHTML = '';
      if (trips && trips.length > 0) {
        trips.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t.trip_id;
          opt.textContent = `ID:${t.trip_id} | ${t.measured_date} | ${t.title}`;
          modeSelect.appendChild(opt);
        });
        loadData();
      }
    } catch (err) { console.error(err); }
  }

  async function loadData() {
    const tripId = modeSelect.value;
    if (!tripId || !supabaseClient) return;

    dataLayerGroup.clearLayers();
    barrierLayerGroup.clearLayers();
    statusMsg.innerText = '更新中...';
    
    try {
      const targetCol = (dataTypeSelect.value === 'raw') ? 'raw_geom' : 'cleansed_geom';
      const [barriersRes, tripRes] = await Promise.all([
        supabaseClient.from('barriers').select('barrier_type, intensity, geom').eq('trip_id', tripId).limit(10000),
        supabaseClient.from('trips').select(targetCol).eq('trip_id', tripId).single()
      ]);

      currentBarriers = barriersRes.data || [];
      const tripData = tripRes.data;

      if (!tripData || !tripData[targetCol]) {
        statusMsg.innerText = 'データなし';
        return;
      }

      const rawGeom = tripData[targetCol];
      let coordsArray = [];
      if (rawGeom.type === 'LineString') coordsArray = rawGeom.coordinates;
      else if (typeof rawGeom === 'string') coordsArray = rawGeom.replace(/^.*LINESTRING\s*\(/i, '').replace(/\).*$/, '').split(',').map(p => p.trim().split(/\s+/).map(Number));

      if (coordsArray.length > 0) {
        const latLngs = coordsArray.map(c => [c[1], c[0]]);
        L.polyline(latLngs, { color: (dataTypeSelect.value === 'raw') ? '#8e44ad' : '#16a085', weight: 6, opacity: 0.9 }).addTo(dataLayerGroup);
        map.fitBounds(L.polyline(latLngs).getBounds(), { padding: [30, 30] });
        renderStartEnd(latLngs[0], latLngs[latLngs.length - 1]);
      }
      updateBarrierDisplay();
      statusMsg.innerText = '';
    } catch (err) { console.error(err); }
  }

  function updateBarrierDisplay() {
    barrierLayerGroup.clearLayers();
    const stepThreshold = parseFloat(barrierSlider.value);
    const showWheelie = chkWheelie.checked;
    const showSteep = chkSteep.checked;

    currentBarriers.forEach(b => {
      let draw = false;
      let color = '#e74c3c'; // デフォルト赤(段差)
      let label = '';

      if (b.barrier_type === 'step' && b.intensity >= stepThreshold) {
        draw = true; label = `段差衝撃: ${Number(b.intensity).toFixed(2)} G`; color = '#e74c3c';
      } else if (b.barrier_type === 'wheelie' && showWheelie) {
        draw = true; label = `ウィリー: ${Number(b.intensity).toFixed(2)} deg/s`; color = '#f39c12'; // オレンジ
      } else if (b.barrier_type === 'steep_slope' && showSteep) {
        draw = true; label = `急傾斜: ${Number(b.intensity).toFixed(2)} 度`; color = '#9b59b6'; // 紫
      }

      if (draw) {
        const coords = parsePointGeom(b.geom);
        if (coords) {
          L.circleMarker(coords, { radius: 6, fillColor: color, color: '#ffffff', weight: 2, fillOpacity: 0.9 })
           .bindTooltip(label, { direction: 'top' }).addTo(barrierLayerGroup);
        }
      }
    });
  }

  function renderStartEnd(startPt, endPt) {
    const createIcon = (t, c) => L.divIcon({ className: '', html: `<div style="background:${c}; color:white; font-weight:bold; width:24px; height:24px; line-height:24px; text-align:center; border-radius:50%; border:2px solid white;">${t}</div>`, iconSize: [28, 28], iconAnchor: [14, 14] });
    L.marker(startPt, { icon: createIcon('S', '#2ecc71') }).addTo(dataLayerGroup);
    L.marker(endPt, { icon: createIcon('G', '#e74c3c') }).addTo(dataLayerGroup);
  }

  const legend = L.control({ position: 'bottomright' });
  legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'legend');
    div.innerHTML += '<b>表示凡例</b><br>';
    div.innerHTML += '<i style="background: #16a085;"></i>ルート (OSRM補正)<br>';
    div.innerHTML += '<i style="background: #e74c3c;"></i>段差・衝撃 (赤)<br>';
    div.innerHTML += '<i style="background: #f39c12;"></i>ウィリー動作 (オレンジ)<br>';
    div.innerHTML += '<i style="background: #9b59b6;"></i>急傾斜 (紫)<br>';
    return div;
  };
  legend.addTo(map);

  fetchTripList();
</script>
</body>
</html>
