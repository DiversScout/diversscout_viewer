<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER-WHEELCHAIR ROUTE VIEWER v1.0</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* ネオンカラーパレット */
      --neon-cyan: #0ff;
      --neon-magenta: #f0f;
      --neon-yellow: #ff0;
      --neon-orange: #f90;
      --neon-green: #3f3;
      
      --bg-dark: rgba(5, 5, 10, 0.9);
      
      --color-route: var(--neon-cyan);
      --color-step: var(--neon-magenta);
      --color-wheelie: var(--neon-orange);
      --color-steep: var(--neon-yellow);
      --color-device: var(--neon-green);
    }

    body, html { 
      margin: 0; padding: 0; height: 100%; 
      font-family: 'Orbitron', -apple-system, sans-serif; 
      background-color: #000;
      overflow: hidden;
      color: var(--neon-cyan);
    }

    /* CRTスキャンライン & ビネット効果 (クリックイベントを貫通させる) */
    body::before {
      content: ""; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      box-shadow: inset 0 0 150px rgba(0,0,0,0.9);
      z-index: 9998; pointer-events: none;
    }
    body::after {
      content: ""; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
      background-size: 100% 4px;
      z-index: 9999; pointer-events: none;
    }

    /* マップ領域 */
    #map { 
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; 
      background: #000;
    }

    /* マップを強制的にダーク・サイバー風に加工 */
    .leaflet-tile-pane {
      filter: invert(100%) sepia(20%) hue-rotate(180deg) brightness(70%) contrast(150%);
    }

    /* SVG（ルートやマーカー）を光らせる */
    .leaflet-overlay-pane svg path {
      filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.5));
    }

    /* SFコンソール風コントロールパネル */
    #control-panel { 
      position: absolute; top: 20px; left: 20px; z-index: 1000; 
      width: 320px; max-height: calc(100vh - 40px); overflow-y: auto;
      background: var(--bg-dark);
      border: 2px solid var(--neon-cyan);
      box-shadow: 0 0 15px var(--neon-cyan), inset 0 0 15px rgba(0, 255, 255, 0.2);
      padding: 20px; 
      display: flex; flex-direction: column; gap: 20px;
    }
    #control-panel::-webkit-scrollbar { width: 4px; }
    #control-panel::-webkit-scrollbar-thumb { background: var(--neon-cyan); box-shadow: 0 0 5px var(--neon-cyan); }

    .panel-section { display: flex; flex-direction: column; gap: 12px; }
    .panel-section h3 { 
      margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 0.1em; 
      border-bottom: 2px solid var(--neon-cyan); padding-bottom: 4px;
      text-shadow: 0 0 8px var(--neon-cyan);
    }
    
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    .control-header { display: flex; justify-content: space-between; align-items: center; }
    .control-label { font-size: 13px; display: flex; align-items: center; gap: 8px; text-shadow: 0 0 5px currentColor; }

    /* レトロフューチャーなセレクトボックス */
    select { 
      width: 100%; padding: 8px 10px; font-size: 12px; font-family: 'Orbitron', sans-serif;
      background: rgba(0,0,0,0.8); color: var(--neon-cyan);
      border: 1px solid var(--neon-cyan);
      box-shadow: 0 0 5px var(--neon-cyan);
      outline: none; cursor: pointer; text-transform: uppercase;
    }
    select:hover { background: rgba(0, 255, 255, 0.15); }
    select option { background: #000; color: var(--neon-cyan); }

    /* サイバーチェックボックス */
    .cyber-checkbox { position: relative; display: inline-block; width: 22px; height: 22px; cursor: pointer; }
    .cyber-checkbox input { opacity: 0; width: 0; height: 0; }
    .checkmark {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      border: 2px solid currentColor; box-shadow: 0 0 8px currentColor;
      transition: 0.2s;
    }
    .cyber-checkbox input:checked ~ .checkmark { background-color: currentColor; box-shadow: 0 0 15px currentColor; }
    .cyber-checkbox input:checked ~ .checkmark:after {
      content: ""; position: absolute; left: 6px; top: 2px;
      width: 5px; height: 10px; border: solid #000; border-width: 0 3px 3px 0; transform: rotate(45deg);
    }

    /* ハードウェア風レンジスライダー */
    .range-container { display: flex; align-items: center; gap: 10px; }
    input[type=range] { -webkit-appearance: none; flex: 1; background: transparent; }
    input[type=range]:focus { outline: none; }
    input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 2px; background: currentColor; box-shadow: 0 0 5px currentColor; cursor: pointer; }
    input[type=range]::-webkit-slider-thumb { 
      height: 18px; width: 10px; background: #000; border: 2px solid currentColor; 
      box-shadow: 0 0 10px currentColor; cursor: pointer; -webkit-appearance: none; margin-top: -8px; 
    }
    .slider-val { font-size: 13px; min-width: 55px; text-align: right; text-shadow: 0 0 5px currentColor; }

    #status-msg { font-size: 11px; font-weight: bold; color: var(--neon-yellow); text-shadow: 0 0 5px var(--neon-yellow); text-transform: uppercase; }

    /* カラーバッジ */
    .color-dot { width: 10px; height: 10px; display: inline-block; box-shadow: 0 0 8px currentColor; border: 1px solid #fff; }

    /* Leaflet UIのサイバー化 */
    .leaflet-bar a {
      background: #000 !important; color: var(--neon-cyan) !important;
      border: 1px solid var(--neon-cyan) !important; box-shadow: 0 0 5px var(--neon-cyan);
    }
    .leaflet-bar a:hover { background: var(--neon-cyan) !important; color: #000 !important; }
    
    .legend { 
      background: rgba(0, 0, 0, 0.85) !important; border: 2px solid var(--neon-cyan); 
      padding: 15px; font-size: 12px; color: var(--neon-cyan); 
      box-shadow: 0 0 15px var(--neon-cyan); line-height: 22px;
      font-family: 'Orbitron', sans-serif;
    }
    .legend i { width: 12px; height: 12px; float: left; margin-top: 5px; margin-right: 10px; box-shadow: 0 0 8px currentColor; }

    /* ツールチップのサイバー化 */
    .leaflet-tooltip { 
      background: rgba(0, 0, 0, 0.9); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); 
      box-shadow: 0 0 10px var(--neon-cyan); font-family: 'Orbitron', sans-serif; text-shadow: 0 0 5px var(--neon-cyan);
      border-radius: 0;
    }
    .leaflet-tooltip-top:before { border-top-color: var(--neon-cyan); }
  </style>
</head>
<body>

<div id="map"></div>

<!-- SFコンソール風コントロールパネル -->
<div id="control-panel">
  <div class="panel-section">
    <h3>SYS_DATA_SOURCE</h3>
    <div class="control-group">
      <div class="control-header"><span class="control-label">TARGET_ROUTE</span></div>
      <select id="mode-select"><option value="">FETCHING DB...</option></select>
    </div>
    <div class="control-group">
      <div class="control-header"><span class="control-label">DATA_TYPE</span></div>
      <select id="datatype-select">
        <option value="cleansed">CLEANSED (OSRM)</option>
        <option value="raw">RAW_GEOMETRY</option>
      </select>
    </div>
    <span id="status-msg"></span>
  </div>

  <div class="panel-section">
    <h3>BARRIER_ANALYTICS</h3>
    <!-- 段差フィルタ -->
    <div class="control-group" style="color: var(--color-step);">
      <div class="control-header">
        <label class="control-label"><span class="color-dot" style="background: currentColor;"></span>STEP_SHOCK</label>
        <label class="cyber-checkbox"><input type="checkbox" id="chk-step" checked><span class="checkmark"></span></label>
      </div>
      <div class="range-container">
        <input type="range" id="step-slider" min="0" max="10" step="0.5" value="3.5">
        <span class="slider-val"><span id="step-val-text">3.5</span> G</span>
      </div>
    </div>

    <!-- ウィリーフィルタ -->
    <div class="control-group" style="color: var(--color-wheelie);">
      <div class="control-header">
        <label class="control-label"><span class="color-dot" style="background: currentColor;"></span>WHEELIE</label>
        <label class="cyber-checkbox"><input type="checkbox" id="chk-wheelie" checked><span class="checkmark"></span></label>
      </div>
      <div class="range-container">
        <input type="range" id="wheelie-slider" min="0" max="300" step="10" value="100">
        <span class="slider-val"><span id="wheelie-val-text">100</span> °/s</span>
      </div>
    </div>

    <!-- 急傾斜フィルタ -->
    <div class="control-group" style="color: var(--color-steep);">
      <div class="control-header">
        <label class="control-label"><span class="color-dot" style="background: currentColor;"></span>STEEP_SLOPE</label>
        <label class="cyber-checkbox"><input type="checkbox" id="chk-steep" checked><span class="checkmark"></span></label>
      </div>
      <div class="range-container">
        <input type="range" id="steep-slider" min="0" max="30" step="1" value="5">
        <span class="slider-val"><span id="steep-val-text">5</span> DEG</span>
      </div>
    </div>
  </div>
  
  <div class="panel-section">
    <h3>TRACKING_DEVICE</h3>
    <div class="control-group" style="color: var(--color-device);">
      <div class="control-header">
        <label class="control-label"><span class="color-dot" style="background: currentColor;"></span>LIVE_POSITION</label>
        <label class="cyber-checkbox"><input type="checkbox" id="chk-device" checked><span class="checkmark"></span></label>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // ==========================================
  // 接続設定
  // ==========================================
  const SUPABASE_URL = '__SUPABASE_URL__';
  const SUPABASE_ANON_KEY = '__SUPABASE_ANON_KEY__';

  const supabaseClient = (SUPABASE_URL.startsWith('__')) 
    ? null 
    : window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // マップの初期化
  const map = L.map('map', { zoomControl: false }).setView([33.883, 130.875], 15);
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  // ベースマップ
  const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
  osmLayer.addTo(map);
  
  const dataLayerGroup = L.layerGroup().addTo(map);
  const barrierLayerGroup = L.layerGroup().addTo(map);
  const deviceLayerGroup = L.layerGroup().addTo(map);

  let currentBarriers = [];
  let currentDevices = [];
  
  // UI要素
  const modeSelect = document.getElementById('mode-select');
  const dataTypeSelect = document.getElementById('datatype-select');
  const statusMsg = document.getElementById('status-msg');

  const chkStep = document.getElementById('chk-step');
  const stepSlider = document.getElementById('step-slider');
  const stepValText = document.getElementById('step-val-text');

  const chkWheelie = document.getElementById('chk-wheelie');
  const wheelieSlider = document.getElementById('wheelie-slider');
  const wheelieValText = document.getElementById('wheelie-val-text');

  const chkSteep = document.getElementById('chk-steep');
  const steepSlider = document.getElementById('steep-slider');
  const steepValText = document.getElementById('steep-val-text');

  const chkDevice = document.getElementById('chk-device');

  // イベントリスナー
  modeSelect.addEventListener('change', loadData);
  dataTypeSelect.addEventListener('change', loadData);

  [chkStep, chkWheelie, chkSteep].forEach(chk => {
    chk.addEventListener('change', updateBarrierDisplay);
  });
  chkDevice.addEventListener('change', updateDeviceDisplay);

  stepSlider.addEventListener('input', function() {
    stepValText.innerText = parseFloat(this.value).toFixed(1);
    updateBarrierDisplay();
  });
  wheelieSlider.addEventListener('input', function() {
    wheelieValText.innerText = parseInt(this.value, 10);
    updateBarrierDisplay();
  });
  steepSlider.addEventListener('input', function() {
    steepValText.innerText = parseInt(this.value, 10);
    updateBarrierDisplay();
  });

  function parsePointGeom(geom) {
    if (!geom) return null;
    if (geom.type === 'Point' && Array.isArray(geom.coordinates)) return [geom.coordinates[1], geom.coordinates[0]];
    if (typeof geom === 'string') {
      const match = geom.match(/POINT\s*\(\s*([-\d.]+)\s+([-\d.]+)\s*\)/i);
      if (match) return [parseFloat(match[2]), parseFloat(match[1])];
    }
    return null;
  }

  async function fetchTripList() {
    if (!supabaseClient) return;
    try {
      const { data: trips } = await supabaseClient
        .from('trips')
        .select('trip_id, title, measured_date, event_name')
        .order('created_at', { ascending: false });
        
      modeSelect.innerHTML = '';
      if (trips && trips.length > 0) {
        trips.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t.trip_id;
          const displayName = t.event_name ? t.event_name : t.title;
          opt.textContent = `ID:${t.trip_id} | ${displayName}`;
          modeSelect.appendChild(opt);
        });
        loadData();
      }
    } catch (err) { console.error(err); }
  }

  async function fetchDeviceStatus() {
    if (!supabaseClient) return;
    try {
      const { data, error } = await supabaseClient.from('device_current_status').select('*');
      if (!error && data) {
        currentDevices = data;
        updateDeviceDisplay();
      }
    } catch (err) {}
  }

  async function loadData() {
    const tripId = modeSelect.value;
    if (!tripId || !supabaseClient) return;

    dataLayerGroup.clearLayers();
    barrierLayerGroup.clearLayers();
    statusMsg.innerText = 'LOADING...';
    
    try {
      const targetCol = (dataTypeSelect.value === 'raw') ? 'raw_geom' : 'cleansed_geom';
      const [barriersRes, tripRes] = await Promise.all([
        supabaseClient.from('barriers').select('barrier_type, intensity, geom').eq('trip_id', tripId).limit(10000),
        supabaseClient.from('trips').select(targetCol).eq('trip_id', tripId).single()
      ]);

      currentBarriers = barriersRes.data || [];
      const tripData = tripRes.data;

      if (!tripData || !tripData[targetCol]) {
        statusMsg.innerText = 'NO DATA';
        return;
      }

      const rawGeom = tripData[targetCol];
      let coordsArray = [];
      if (rawGeom.type === 'LineString') coordsArray = rawGeom.coordinates;
      else if (typeof rawGeom === 'string') coordsArray = rawGeom.replace(/^.*LINESTRING\s*\(/i, '').replace(/\).*$/, '').split(',').map(p => p.trim().split(/\s+/).map(Number));

      if (coordsArray.length > 0) {
        const latLngs = coordsArray.map(c => [c[1], c[0]]);
        // ルート線描画
        L.polyline(latLngs, { color: 'var(--color-route)', weight: 5, opacity: 0.9 }).addTo(dataLayerGroup);
        map.fitBounds(L.polyline(latLngs).getBounds(), { padding: [30, 30] });
        renderStartEnd(latLngs[0], latLngs[latLngs.length - 1]);
      }
      
      updateBarrierDisplay();
      statusMsg.innerText = '';
    } catch (err) { console.error(err); statusMsg.innerText = 'ERROR'; }
  }

  function updateBarrierDisplay() {
    barrierLayerGroup.clearLayers();

    const isStepOn = chkStep.checked; const stepThresh = parseFloat(stepSlider.value);
    const isWheelieOn = chkWheelie.checked; const wheelieThresh = parseFloat(wheelieSlider.value);
    const isSteepOn = chkSteep.checked; const steepThresh = parseFloat(steepSlider.value);

    const style = getComputedStyle(document.body);
    const colorStep = style.getPropertyValue('--color-step').trim();
    const colorWheelie = style.getPropertyValue('--color-wheelie').trim();
    const colorSteep = style.getPropertyValue('--color-steep').trim();

    currentBarriers.forEach(b => {
      let draw = false; let color = ''; let label = ''; let radius = 6;

      if (b.barrier_type === 'step' && isStepOn && b.intensity >= stepThresh) {
        draw = true; color = colorStep; label = `SHOCK: ${Number(b.intensity).toFixed(2)} G`; radius = 7;
      } else if (b.barrier_type === 'wheelie' && isWheelieOn && Math.abs(b.intensity) >= wheelieThresh) {
        draw = true; color = colorWheelie; label = `WHEELIE: ${Number(Math.abs(b.intensity)).toFixed(1)} °/s`; radius = 6;
      } else if (b.barrier_type === 'steep_slope' && isSteepOn && b.intensity >= steepThresh) {
        draw = true; color = colorSteep; label = `SLOPE: ${Number(b.intensity).toFixed(1)} °`; radius = 5;
      }

      if (draw) {
        const coords = parsePointGeom(b.geom);
        if (coords) {
          L.circleMarker(coords, { radius: radius, fillColor: '#000', color: color, weight: 3, fillOpacity: 0.8 })
           .bindTooltip(label, { direction: 'top' }).addTo(barrierLayerGroup);
        }
      }
    });
  }

  function updateDeviceDisplay() {
    deviceLayerGroup.clearLayers();
    if (!chkDevice.checked) return;

    const style = getComputedStyle(document.body);
    const colorDevice = style.getPropertyValue('--color-device').trim();

    currentDevices.forEach(d => {
      if (d.lat == null || d.lon == null) return;
      
      const tooltipHtml = `
        <div style="font-size: 11px; line-height: 1.6;">
          <strong style="color: ${colorDevice}; font-size: 13px;">${d.device_id}</strong><br>
          NAME: ${d.device_name || 'UNKNOWN'}<br>
          STAT: ${d.status}<br>
          TEMP: ${d.temperature} C<br>
          FIXD: ${d.is_fixed ? 'YES' : 'NO'}<br>
          TIME: ${new Date(d.jst).toLocaleTimeString()}
        </div>
      `;
      
      L.circleMarker([d.lat, d.lon], { 
        radius: 7, fillColor: '#000', color: colorDevice, weight: 3, fillOpacity: 0.9 
      })
      .bindTooltip(tooltipHtml, { direction: 'top' })
      .addTo(deviceLayerGroup);
    });
  }

  function renderStartEnd(startPt, endPt) {
    const createIcon = (t, c) => L.divIcon({ 
      className: '', 
      html: `<div style="background:#000; color:${c}; font-size:12px; font-weight:bold; width:22px; height:22px; line-height:20px; text-align:center; border:2px solid ${c}; box-shadow:0 0 10px ${c};">${t}</div>`, 
      iconSize: [26, 26], iconAnchor: [13, 13] 
    });
    L.marker(startPt, { icon: createIcon('S', 'var(--color-route)') }).addTo(dataLayerGroup);
    L.marker(endPt, { icon: createIcon('G', 'var(--color-step)') }).addTo(dataLayerGroup);
  }

  // レトロフューチャー凡例
  const legend = L.control({ position: 'bottomleft' });
  legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'legend');
    div.innerHTML += '<div style="margin-bottom: 8px; font-weight: 900; border-bottom: 1px solid var(--neon-cyan); padding-bottom: 4px; text-shadow: 0 0 5px var(--neon-cyan);">SYS_LEGEND</div>';
    div.innerHTML += '<i style="background: var(--color-route); color: var(--color-route);"></i>ROUTE_TRACK<br>';
    div.innerHTML += '<i style="background: var(--color-step); color: var(--color-step);"></i>STEP_SHOCK<br>';
    div.innerHTML += '<i style="background: var(--color-wheelie); color: var(--color-wheelie);"></i>WHEELIE_ACT<br>';
    div.innerHTML += '<i style="background: var(--color-steep); color: var(--color-steep);"></i>STEEP_SLOPE<br>';
    div.innerHTML += '<i style="background: var(--color-device); color: var(--color-device);"></i>LIVE_DEVICE<br>';
    return div;
  };
  legend.addTo(map);

  // 初期ロード
  fetchTripList();
  fetchDeviceStatus();
</script>
</body>
</html>
