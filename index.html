<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER-WHEELCHAIR ROUTE VIEWER v1.0</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* 通常モード用フラットカラー（レトロフューチャー指定前） */
      --color-route: #16a085;
      --color-step: #d63031;
      --color-wheelie: #e17055;
      --color-steep: #6c5ce7;
      --color-device: #0984e3;
      
      /* CYBER_MODE用ネオンカラー */
      --neon-cyan: #0ff;
      --neon-magenta: #f0f;
      --neon-yellow: #ff0;
      --neon-orange: #f90;
      --neon-green: #3f3;
      
      --bg-dark: rgba(5, 5, 10, 0.9);
    }

    body, html { 
      margin: 0; padding: 0; height: 100%; 
      font-family: 'Orbitron', -apple-system, sans-serif; 
      overflow: hidden;
      color: var(--neon-cyan);
      background-color: #f0f0f0; 
    }

    /* CYBER_MODE時はCSS変数をネオンカラーに上書き */
    body.cyber-mode {
      background-color: #000;
      --color-route: var(--neon-cyan);
      --color-step: var(--neon-magenta);
      --color-wheelie: var(--neon-orange);
      --color-steep: var(--neon-yellow);
      --color-device: var(--neon-green);
    }

    /* マップ領域 */
    #map { 
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; 
      background: #ddd; 
    }
    body.cyber-mode #map { background: #000; }

    /* =========================================
       サイバーエフェクト専用レイヤー
       ========================================= */
    #cyber-effects {
      display: none; 
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 5000; 
    }
    body.cyber-mode #cyber-effects { display: block; }
    
    #cyber-effects::before {
      content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      box-shadow: inset 0 0 120px rgba(0,0,0,0.9);
    }
    #cyber-effects::after {
      content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
      background-size: 100% 4px;
    }

    /* CYBER_MODE時のマップ色反転 */
    .cyber-tile {
      filter: invert(100%) sepia(20%) hue-rotate(180deg) brightness(70%) contrast(150%);
    }
    /* CYBER_MODE時のみ、ルート線だけを発光させる（マーカーにはかけない） */
    body.cyber-mode .cyber-route-line {
      filter: drop-shadow(0 0 8px var(--neon-cyan));
    }

    /* =========================================
       UIパネル共通スタイル
       ========================================= */
    .cyber-panel {
      background: var(--bg-dark);
      border: 2px solid var(--neon-cyan);
      box-shadow: 0 0 15px var(--neon-cyan), inset 0 0 15px rgba(0, 255, 255, 0.2);
      padding: 15px;
      z-index: 10000; /* マップやエフェクトより確実に前面に出す */
    }

    .panel-header {
      display: flex; justify-content: space-between; align-items: center;
      cursor: pointer;
      border-bottom: 2px solid var(--neon-cyan); padding-bottom: 8px;
      margin-bottom: 10px;
      transition: background 0.2s;
    }
    .panel-header:hover { background: rgba(0, 255, 255, 0.15); }
    .panel-header h2 { 
      margin: 0; font-size: 14px; font-weight: 900; letter-spacing: 0.1em; 
      text-shadow: 0 0 8px var(--neon-cyan);
    }
    
    .cyber-btn {
      background: rgba(0, 0, 0, 0.8); color: var(--neon-cyan);
      border: 1px solid var(--neon-cyan); padding: 4px 8px;
      font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: bold; cursor: pointer;
      box-shadow: 0 0 5px var(--neon-cyan); transition: all 0.2s ease-in-out; text-transform: uppercase;
    }
    .cyber-btn:hover { background: var(--neon-cyan); color: #000; }
    .cyber-btn.collapsed-state { color: #f90; border-color: #f90; box-shadow: 0 0 5px #f90; }
    .cyber-btn.collapsed-state:hover { background: #f90; color: #000; }

    .collapsed { display: none !important; }

    /* コントロールパネル (左上) */
    #control-panel { 
      position: absolute; top: 20px; left: 20px; width: 320px; 
    }
    #control-content {
      display: flex; flex-direction: column; gap: 20px;
      max-height: calc(100vh - 120px); overflow-y: auto; padding-right: 5px;
    }
    #control-content::-webkit-scrollbar { width: 4px; }
    #control-content::-webkit-scrollbar-thumb { background: var(--neon-cyan); box-shadow: 0 0 5px var(--neon-cyan); }

    /* 凡例パネル (右下) - 完全に独立したDOMとして配置 */
    #legend-panel {
      position: absolute; bottom: 25px; right: 20px; width: 220px;
    }
    #legend-content {
      font-size: 12px; color: var(--neon-cyan); line-height: 22px; font-family: 'Orbitron', sans-serif;
    }
    #legend-content i { 
      width: 12px; height: 12px; float: left; margin-top: 5px; margin-right: 10px; 
      box-shadow: 0 0 8px currentColor; 
    }

    /* UIパーツ類 */
    .layer-btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .layer-btn {
      background: rgba(0, 0, 0, 0.8); color: var(--neon-cyan); border: 1px solid var(--neon-cyan); padding: 8px 4px;
      font-family: 'Orbitron', sans-serif; font-size: 10px; cursor: pointer; transition: all 0.2s; text-align: center;
    }
    .layer-btn:hover { background: rgba(0, 255, 255, 0.2); }
    .layer-btn.active { background: var(--neon-cyan); color: #000; box-shadow: 0 0 10px var(--neon-cyan); font-weight: bold; }

    .panel-section { display: flex; flex-direction: column; gap: 12px; }
    .panel-section h3 { 
      margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; 
      border-bottom: 1px dashed var(--neon-cyan); padding-bottom: 4px; text-shadow: 0 0 5px var(--neon-cyan); opacity: 0.8;
    }
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    .control-header { display: flex; justify-content: space-between; align-items: center; }
    .control-label { font-size: 13px; display: flex; align-items: center; gap: 8px; text-shadow: 0 0 5px currentColor; }

    select { 
      width: 100%; padding: 8px 10px; font-size: 12px; font-family: 'Orbitron', sans-serif;
      background: rgba(0,0,0,0.8); color: var(--neon-cyan); border: 1px solid var(--neon-cyan); box-shadow: 0 0 5px var(--neon-cyan);
      outline: none; cursor: pointer; text-transform: uppercase;
    }
    select:hover { background: rgba(0, 255, 255, 0.15); }
    select option { background: #000; color: var(--neon-cyan); }

    .cyber-checkbox { position: relative; display: inline-block; width: 22px; height: 22px; cursor: pointer; }
    .cyber-checkbox input { opacity: 0; width: 0; height: 0; }
    .checkmark {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      border: 2px solid currentColor; box-shadow: 0 0 8px currentColor; transition: 0.2s;
    }
    .cyber-checkbox input:checked ~ .checkmark { background-color: currentColor; box-shadow: 0 0 15px currentColor; }
    .cyber-checkbox input:checked ~ .checkmark:after {
      content: ""; position: absolute; left: 6px; top: 2px;
      width: 5px; height: 10px; border: solid #000; border-width: 0 3px 3px 0; transform: rotate(45deg);
    }

    .range-container { display: flex; align-items: center; gap: 10px; }
    input[type=range] { 
      -webkit-appearance: none; flex: 1; background: transparent; 
      position: relative; z-index: 10; cursor: pointer; 
    }
    input[type=range]:focus { outline: none; }
    input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 2px; background: currentColor; box-shadow: 0 0 5px currentColor; cursor: pointer; }
    
    /* スライダーつまみ (白丸) */
    input[type=range]::-webkit-slider-thumb { 
      height: 16px; width: 16px; background: #ffffff; border: 3px solid currentColor; border-radius: 50%;
      box-shadow: 0 0 8px currentColor; cursor: pointer; -webkit-appearance: none; margin-top: -7px; 
    }
    .slider-val { font-size: 13px; min-width: 55px; text-align: right; text-shadow: 0 0 5px currentColor; }
    #status-msg { font-size: 11px; font-weight: bold; color: #ff0; text-shadow: 0 0 5px #ff0; text-transform: uppercase; }
    .color-dot { width: 10px; height: 10px; display: inline-block; box-shadow: 0 0 8px currentColor; border: 1px solid #fff; }

    /* Leaflet ツールチップ */
    .leaflet-tooltip { 
      background: rgba(0, 0, 0, 0.9); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); 
      box-shadow: 0 0 10px var(--neon-cyan); font-family: 'Orbitron', sans-serif; text-shadow: 0 0 5px var(--neon-cyan); border-radius: 0;
    }
    .leaflet-tooltip-top:before { border-top-color: var(--neon-cyan); }
  </style>
</head>
<body>

<div id="map"></div>
<div id="cyber-effects"></div>

<!-- コントロールパネル (左上) -->
<div id="control-panel" class="cyber-panel">
  <div class="panel-header" onclick="toggleSection('control-content', 'btn-control')">
    <h2>SYS_CONTROL</h2>
    <button id="btn-control" class="cyber-btn">▼ CLOSE</button>
  </div>

  <div id="control-content">
    <div class="panel-section">
      <h3>MAP_LAYER</h3>
      <div class="layer-btn-group">
        <button class="layer-btn active" onclick="switchMapLayer('osm', this)">NORMAL (OSM)</button>
        <button class="layer-btn" onclick="switchMapLayer('cyber', this)">CYBER_MODE</button>
        <button class="layer-btn" onclick="switchMapLayer('gsi', this)">GSI_MAP</button>
        <button class="layer-btn" onclick="switchMapLayer('topo', this)">TOPO_MAP</button>
      </div>
    </div>

    <div class="panel-section">
      <h3>SYS_DATA_SOURCE</h3>
      <div class="control-group">
        <div class="control-header"><span class="control-label">TARGET_ROUTE</span></div>
        <select id="mode-select"><option value="">FETCHING DB...</option></select>
      </div>
      <div class="control-group">
        <div class="control-header"><span class="control-label">DATA_TYPE</span></div>
        <select id="datatype-select">
          <option value="cleansed">CLEANSED (OSRM)</option>
          <option value="raw">RAW_GEOMETRY</option>
        </select>
      </div>
      <span id="status-msg"></span>
    </div>

    <div class="panel-section">
      <h3>BARRIER_ANALYTICS</h3>
      <div class="control-group" style="color: var(--color-step);">
        <div class="control-header">
          <label class="control-label"><span class="color-dot" style="background: currentColor;"></span>STEP_SHOCK</label>
          <label class="cyber-checkbox"><input type="checkbox" id="chk-step" checked><span class="checkmark"></span></label>
        </div>
        <div class="range-container">
          <input type="range" id="step-slider" min="0" max="10" step="0.5" value="3.5">
          <span class="slider-val"><span id="step-val-text">3.5</span> G</span>
        </div>
      </div>

      <div class="control-group" style="color: var(--color-wheelie);">
        <div class="control-header">
          <label class="control-label"><span class="color-dot" style="background: currentColor;"></span>WHEELIE</label>
          <label class="cyber-checkbox"><input type="checkbox" id="chk-wheelie" checked><span class="checkmark"></span></label>
        </div>
        <div class="range-container">
          <input type="range" id="wheelie-slider" min="0" max="300" step="10" value="100">
          <span class="slider-val"><span id="wheelie-val-text">100</span> °/s</span>
        </div>
      </div>

      <div class="control-group" style="color: var(--color-steep);">
        <div class="control-header">
          <label class="control-label"><span class="color-dot" style="background: currentColor;"></span>STEEP_SLOPE</label>
          <label class="cyber-checkbox"><input type="checkbox" id="chk-steep" checked><span class="checkmark"></span></label>
        </div>
        <div class="range-container">
          <input type="range" id="steep-slider" min="0" max="30" step="1" value="5">
          <span class="slider-val"><span id="steep-val-text">5</span> DEG</span>
        </div>
      </div>
    </div>
    
    <div class="panel-section">
      <h3>TRACKING_DEVICE</h3>
      <div class="control-group" style="color: var(--color-device);">
        <div class="control-header">
          <label class="control-label"><span class="color-dot" style="background: currentColor;"></span>LIVE_POSITION</label>
          <label class="cyber-checkbox"><input type="checkbox" id="chk-device" checked><span class="checkmark"></span></label>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 凡例パネル (右下) 独立化 -->
<div id="legend-panel" class="cyber-panel">
  <div class="panel-header" onclick="toggleSection('legend-content', 'btn-legend')" style="margin-bottom:0; padding-bottom: 5px;">
    <h2>SYS_LEGEND</h2>
    <button id="btn-legend" class="cyber-btn">▼ CLOSE</button>
  </div>
  <div id="legend-content" style="margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--neon-cyan);">
    <i style="background: var(--color-route); color: var(--color-route);"></i>ROUTE_TRACK<br>
    <i style="background: var(--color-step); color: var(--color-step);"></i>STEP_SHOCK<br>
    <i style="background: var(--color-wheelie); color: var(--color-wheelie);"></i>WHEELIE_ACT<br>
    <i style="background: var(--color-steep); color: var(--color-steep);"></i>STEEP_SLOPE<br>
    <i style="background: var(--color-device); color: var(--color-device);"></i>LIVE_DEVICE<br>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  function toggleSection(contentId, btnId) {
    const content = document.getElementById(contentId);
    const btn = document.getElementById(btnId);
    const header = btn.closest('.panel-header');
    
    if (content.classList.contains('collapsed')) {
      content.classList.remove('collapsed');
      btn.innerHTML = '▼ CLOSE';
      btn.classList.remove('collapsed-state');
      if(contentId === 'legend-content') header.style.borderBottom = '2px solid var(--neon-cyan)';
    } else {
      content.classList.add('collapsed');
      btn.innerHTML = '▶ OPEN';
      btn.classList.add('collapsed-state');
      if(contentId === 'legend-content') header.style.borderBottom = 'none';
    }
  }

  // ==========================================
  // 接続設定
  // ==========================================
  const SUPABASE_URL = '__SUPABASE_URL__';
  const SUPABASE_ANON_KEY = '__SUPABASE_ANON_KEY__';

  const supabaseClient = (SUPABASE_URL.startsWith('__')) 
    ? null : window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const map = L.map('map', { zoomControl: false }).setView([33.883, 130.875], 15);
  L.control.zoom({ position: 'topright' }).addTo(map);
  
  const layers = {
    osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }),
    cyber: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap', className: 'cyber-tile' }),
    gsi: L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '国土地理院' }),
    topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17, attribution: '© OpenTopoMap' })
  };

  let currentBaseLayer = layers.osm;
  currentBaseLayer.addTo(map);
  let currentTripLatLngs = null; 

  const dataLayerGroup = L.layerGroup().addTo(map);
  const barrierLayerGroup = L.layerGroup().addTo(map);
  const deviceLayerGroup = L.layerGroup().addTo(map);

  let currentBarriers = [];
  let currentDevices = [];

  // 描画順を制御し、必ずルート→マーカーの順に再描画する
  function redrawAllMapElements() {
    dataLayerGroup.clearLayers();
    barrierLayerGroup.clearLayers();
    deviceLayerGroup.clearLayers();

    const isCyber = document.body.classList.contains('cyber-mode');

    // 1. ルート線を先に描画（最背面）
    if (currentTripLatLngs && currentTripLatLngs.length > 0) {
      const routeColor = isCyber ? 'var(--neon-cyan)' : 'var(--color-route)';
      const routeWeight = isCyber ? 5 : 6;
      L.polyline(currentTripLatLngs, { 
        color: routeColor, weight: routeWeight, opacity: 0.9, 
        className: 'cyber-route-line' // このクラスにのみ発光フィルタを適用
      }).addTo(dataLayerGroup);
      
      renderStartEnd(currentTripLatLngs[0], currentTripLatLngs[currentTripLatLngs.length - 1]);
    }
    
    // 2. マーカー類を後に描画（前面）
    updateBarrierDisplay();
    updateDeviceDisplay();
  }

  window.switchMapLayer = function(layerKey, btnElem) {
    map.removeLayer(currentBaseLayer);
    currentBaseLayer = layers[layerKey];
    currentBaseLayer.addTo(map);

    if (layerKey === 'cyber') {
      document.body.classList.add('cyber-mode');
    } else {
      document.body.classList.remove('cyber-mode');
    }
    
    document.querySelectorAll('.layer-btn').forEach(btn => btn.classList.remove('active'));
    btnElem.classList.add('active');

    // モード切替時に描画順序を保ったまま再描画
    redrawAllMapElements();
  };
  
  const modeSelect = document.getElementById('mode-select');
  const dataTypeSelect = document.getElementById('datatype-select');
  const statusMsg = document.getElementById('status-msg');

  const chkStep = document.getElementById('chk-step');
  const stepSlider = document.getElementById('step-slider');
  const stepValText = document.getElementById('step-val-text');

  const chkWheelie = document.getElementById('chk-wheelie');
  const wheelieSlider = document.getElementById('wheelie-slider');
  const wheelieValText = document.getElementById('wheelie-val-text');

  const chkSteep = document.getElementById('chk-steep');
  const steepSlider = document.getElementById('steep-slider');
  const steepValText = document.getElementById('steep-val-text');

  const chkDevice = document.getElementById('chk-device');

  modeSelect.addEventListener('change', loadData);
  dataTypeSelect.addEventListener('change', loadData);

  [chkStep, chkWheelie, chkSteep].forEach(chk => { chk.addEventListener('change', updateBarrierDisplay); });
  chkDevice.addEventListener('change', updateDeviceDisplay);

  stepSlider.addEventListener('input', function() { stepValText.innerText = parseFloat(this.value).toFixed(1); updateBarrierDisplay(); });
  wheelieSlider.addEventListener('input', function() { wheelieValText.innerText = parseInt(this.value, 10); updateBarrierDisplay(); });
  steepSlider.addEventListener('input', function() { steepValText.innerText = parseInt(this.value, 10); updateBarrierDisplay(); });

  function parsePointGeom(geom) {
    if (!geom) return null;
    if (geom.type === 'Point' && Array.isArray(geom.coordinates)) return [geom.coordinates[1], geom.coordinates[0]];
    if (typeof geom === 'string') {
      const match = geom.match(/POINT\s*\(\s*([-\d.]+)\s+([-\d.]+)\s*\)/i);
      if (match) return [parseFloat(match[2]), parseFloat(match[1])];
    }
    return null;
  }

  async function fetchTripList() {
    if (!supabaseClient) return;
    try {
      const { data: trips } = await supabaseClient.from('trips').select('trip_id, title, measured_date, event_name').order('created_at', { ascending: false });
      modeSelect.innerHTML = '';
      if (trips && trips.length > 0) {
        trips.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t.trip_id;
          opt.textContent = `ID:${t.trip_id} | ${t.event_name ? t.event_name : t.title}`;
          modeSelect.appendChild(opt);
        });
        loadData();
      }
    } catch (err) { console.error(err); }
  }

  async function fetchDeviceStatus() {
    if (!supabaseClient) return;
    try {
      const { data, error } = await supabaseClient.from('device_current_status').select('*');
      if (!error && data) {
        currentDevices = data;
        updateDeviceDisplay();
      }
    } catch (err) {}
  }

  async function loadData() {
    const tripId = modeSelect.value;
    if (!tripId || !supabaseClient) return;

    statusMsg.innerText = 'LOADING...';
    
    try {
      const targetCol = (dataTypeSelect.value === 'raw') ? 'raw_geom' : 'cleansed_geom';
      const [barriersRes, tripRes] = await Promise.all([
        supabaseClient.from('barriers').select('barrier_type, intensity, geom').eq('trip_id', tripId).limit(10000),
        supabaseClient.from('trips').select(targetCol).eq('trip_id', tripId).single()
      ]);

      currentBarriers = barriersRes.data || [];
      const tripData = tripRes.data;

      if (!tripData || !tripData[targetCol]) { statusMsg.innerText = 'NO DATA'; return; }

      const rawGeom = tripData[targetCol];
      let coordsArray = [];
      if (rawGeom.type === 'LineString') coordsArray = rawGeom.coordinates;
      else if (typeof rawGeom === 'string') coordsArray = rawGeom.replace(/^.*LINESTRING\s*\(/i, '').replace(/\).*$/, '').split(',').map(p => p.trim().split(/\s+/).map(Number));

      if (coordsArray.length > 0) {
        currentTripLatLngs = coordsArray.map(c => [c[1], c[0]]);
        map.fitBounds(L.polyline(currentTripLatLngs).getBounds(), { padding: [30, 30] });
      } else {
        currentTripLatLngs = null;
      }
      
      redrawAllMapElements();
      statusMsg.innerText = '';
    } catch (err) { statusMsg.innerText = 'ERROR'; }
  }

  function updateBarrierDisplay() {
    barrierLayerGroup.clearLayers();
    const isCyber = document.body.classList.contains('cyber-mode');
    
    // JS側でモードごとに色を確実に指定する
    const colorStep = isCyber ? '#f0f' : '#d63031';
    const colorWheelie = isCyber ? '#f90' : '#e17055';
    const colorSteep = isCyber ? '#ff0' : '#6c5ce7';

    currentBarriers.forEach(b => {
      let draw = false; let color = ''; let label = ''; let radius = 6;
      if (b.barrier_type === 'step' && chkStep.checked && b.intensity >= parseFloat(stepSlider.value)) {
        draw = true; color = colorStep; label = `SHOCK: ${Number(b.intensity).toFixed(2)} G`; radius = 7;
      } else if (b.barrier_type === 'wheelie' && chkWheelie.checked && Math.abs(b.intensity) >= parseFloat(wheelieSlider.value)) {
        draw = true; color = colorWheelie; label = `WHEELIE: ${Number(Math.abs(b.intensity)).toFixed(1)} °/s`; radius = 6;
      } else if (b.barrier_type === 'steep_slope' && chkSteep.checked && b.intensity >= parseFloat(steepSlider.value)) {
        draw = true; color = colorSteep; label = `SLOPE: ${Number(b.intensity).toFixed(1)} °`; radius = 5;
      }

      if (draw) {
        const coords = parsePointGeom(b.geom);
        if (coords) {
          const markerOpts = isCyber
            ? { radius: radius, fillColor: '#000', color: color, weight: 3, fillOpacity: 0.8 }
            : { radius: radius, fillColor: color, color: '#ffffff', weight: 1.5, fillOpacity: 0.85 };
          L.circleMarker(coords, markerOpts).bindTooltip(label, { direction: 'top' }).addTo(barrierLayerGroup);
        }
      }
    });
  }

  function updateDeviceDisplay() {
    deviceLayerGroup.clearLayers();
    if (!chkDevice.checked) return;

    const isCyber = document.body.classList.contains('cyber-mode');
    const colorDevice = isCyber ? '#3f3' : '#0984e3';

    currentDevices.forEach(d => {
      if (d.lat == null || d.lon == null) return;
      const tooltipHtml = `<div style="font-size: 11px; line-height: 1.6;"><strong style="color: ${colorDevice}; font-size: 13px;">${d.device_id}</strong><br>NAME: ${d.device_name || 'UNKNOWN'}<br>STAT: ${d.status}<br>TEMP: ${d.temperature} C<br>FIXD: ${d.is_fixed ? 'YES' : 'NO'}<br>TIME: ${new Date(d.jst).toLocaleTimeString()}</div>`;
      
      const markerOpts = isCyber
        ? { radius: 7, fillColor: '#000', color: colorDevice, weight: 3, fillOpacity: 0.9 }
        : { radius: 8, fillColor: colorDevice, color: '#ffffff', weight: 2, fillOpacity: 0.9 };

      L.circleMarker([d.lat, d.lon], markerOpts).bindTooltip(tooltipHtml, { direction: 'top' }).addTo(deviceLayerGroup);
    });
  }

  function renderStartEnd(startPt, endPt) {
    const isCyber = document.body.classList.contains('cyber-mode');
    const colorStart = isCyber ? 'var(--neon-cyan)' : '#16a085';
    const colorEnd = isCyber ? 'var(--neon-magenta)' : '#d63031';

    const createIcon = (t, c) => {
      const htmlStr = isCyber
        ? `<div style="background:#000; color:${c}; font-size:12px; font-weight:bold; width:22px; height:22px; line-height:20px; text-align:center; border:2px solid ${c}; box-shadow:0 0 10px ${c};">${t}</div>`
        : `<div style="background:${c}; color:white; font-size:12px; font-weight:bold; width:24px; height:24px; line-height:24px; text-align:center; border-radius:50%; border:2px solid white; box-shadow:0 3px 6px rgba(0,0,0,0.4);">${t}</div>`;
      return L.divIcon({ className: '', html: htmlStr, iconSize: [26, 26], iconAnchor: [13, 13] });
    };
    L.marker(startPt, { icon: createIcon('S', colorStart) }).addTo(dataLayerGroup);
    L.marker(endPt, { icon: createIcon('G', colorEnd) }).addTo(dataLayerGroup);
  }

  fetchTripList();
  fetchDeviceStatus();
</script>
</body>
</html>
